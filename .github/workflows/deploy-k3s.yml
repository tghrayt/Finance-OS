name: deploy-k3s

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/finance-os/gateway
      FINANCE_API_IMAGE: ghcr.io/${{ github.repository_owner }}/finance-os/finance-api
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/finance-os/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/gateway/FinanceOS.Gateway/Dockerfile
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GATEWAY_IMAGE }}:latest

      - name: Build and push finance api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/finance/FinanceOS.Finance.Api/Dockerfile
          push: true
          tags: |
            ${{ env.FINANCE_API_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FINANCE_API_IMAGE }}:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.WEB_IMAGE }}:latest

      - name: Check VM deployment configuration
        id: vm_config
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
        run: |
          if [ -z "$VM_HOST" ] || [ -z "$VM_USER" ] || [ -z "$VM_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VM deployment secrets are not fully configured. Skipping k3s deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "port=${VM_SSH_PORT:-22}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.vm_config.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/financeos_deploy_key
          chmod 600 ~/.ssh/financeos_deploy_key
          ssh-keyscan -T 20 -p "${{ steps.vm_config.outputs.port }}" -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to k3s
        if: steps.vm_config.outputs.configured == 'true'
        run: |
          tar -czf financeos-k8s.tar.gz infrastructure/k8s
          scp -P "${{ steps.vm_config.outputs.port }}" -i ~/.ssh/financeos_deploy_key financeos-k8s.tar.gz "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/financeos-k8s.tar.gz"
          ssh -p "${{ steps.vm_config.outputs.port }}" -i ~/.ssh/financeos_deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" << 'EOF'
            set -e
            rm -rf /tmp/financeos-deploy
            mkdir -p /tmp/financeos-deploy
            tar -xzf /tmp/financeos-k8s.tar.gz -C /tmp/financeos-deploy
            sudo -n kubectl apply -k /tmp/financeos-deploy/infrastructure/k8s/overlays/production
            sudo -n kubectl -n financeos set image deployment/financeos-gateway gateway=${{ env.GATEWAY_IMAGE }}:${{ env.IMAGE_TAG }}
            sudo -n kubectl -n financeos set image deployment/financeos-finance-api finance-api=${{ env.FINANCE_API_IMAGE }}:${{ env.IMAGE_TAG }}
            sudo -n kubectl -n financeos set image deployment/financeos-web web=${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
            sudo -n kubectl -n financeos rollout status deployment/financeos-gateway
            sudo -n kubectl -n financeos rollout status deployment/financeos-finance-api
            sudo -n kubectl -n financeos rollout status deployment/financeos-web
            rm -rf /tmp/financeos-deploy /tmp/financeos-k8s.tar.gz
          EOF
