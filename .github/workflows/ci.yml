name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore FinanceOS.slnx
      - run: dotnet build FinanceOS.slnx --configuration Release --no-restore
      - run: dotnet test FinanceOS.slnx --configuration Release --no-build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --include=optional
        working-directory: apps/web
      - run: npm ls @rollup/rollup-linux-x64-gnu
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run test -- --watch=false
        working-directory: apps/web
