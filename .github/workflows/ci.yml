name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore FinanceOS.slnx
      - run: dotnet build FinanceOS.slnx --configuration Release --no-restore
      - run: dotnet test FinanceOS.slnx --configuration Release --no-build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/web run build
      - run: npm --workspace apps/web run test -- --watch=false
