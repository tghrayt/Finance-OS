apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: financeos
  namespace: financeos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - financeos.example.com
      secretName: financeos-tls
  rules:
    - host: financeos.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: financeos-gateway
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: financeos-web
                port:
                  number: 80
