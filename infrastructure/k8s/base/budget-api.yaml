apiVersion: apps/v1
kind: Deployment
metadata:
  name: financeos-budget-api
  namespace: financeos
  labels:
    app.kubernetes.io/name: financeos-budget-api
    app.kubernetes.io/part-of: financeos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: financeos-budget-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: financeos-budget-api
        app.kubernetes.io/part-of: financeos
    spec:
      containers:
        - name: budget-api
          image: ghcr.io/tghrayt/finance-os/budget-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__BudgetDatabase
              valueFrom:
                secretKeyRef:
                  name: financeos-finance-api-secrets
                  key: finance-database
            - name: Budget__ApplyMigrationsOnStartup
              value: "true"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: financeos-budget-api
  namespace: financeos
  labels:
    app.kubernetes.io/name: financeos-budget-api
    app.kubernetes.io/part-of: financeos
spec:
  selector:
    app.kubernetes.io/name: financeos-budget-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
