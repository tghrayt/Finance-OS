apiVersion: apps/v1
kind: Deployment
metadata:
  name: financeos-web
  namespace: financeos
  labels:
    app.kubernetes.io/name: financeos-web
    app.kubernetes.io/part-of: financeos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: financeos-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: financeos-web
        app.kubernetes.io/part-of: financeos
    spec:
      containers:
        - name: web
          image: ghcr.io/tghrayt/finance-os/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
          livenessProbe:
            httpGet:
              path: /health
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: financeos-web
  namespace: financeos
  labels:
    app.kubernetes.io/name: financeos-web
    app.kubernetes.io/part-of: financeos
spec:
  selector:
    app.kubernetes.io/name: financeos-web
  ports:
    - name: http
      port: 80
      targetPort: 80
