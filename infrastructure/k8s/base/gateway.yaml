apiVersion: apps/v1
kind: Deployment
metadata:
  name: financeos-gateway
  namespace: financeos
  labels:
    app.kubernetes.io/name: financeos-gateway
    app.kubernetes.io/part-of: financeos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: financeos-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: financeos-gateway
        app.kubernetes.io/part-of: financeos
    spec:
      containers:
        - name: gateway
          image: ghcr.io/tghrayt/finance-os/gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ReverseProxy__Clusters__finance__Destinations__default__Address
              value: http://financeos-finance-api/
            - name: ReverseProxy__Clusters__budget__Destinations__default__Address
              value: http://financeos-budget-api/
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: financeos-gateway
  namespace: financeos
  labels:
    app.kubernetes.io/name: financeos-gateway
    app.kubernetes.io/part-of: financeos
spec:
  selector:
    app.kubernetes.io/name: financeos-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
